<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#020617"/>
      <stop offset="100%" stopColor="#064e3b"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#059669"/>
      <stop offset="100%" stopColor="#34d399"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06b6d4"/>
      <stop offset="100%" stopColor="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <rect width="98" height="98" x="1" y="1" rx="23" stroke="#10b981" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Setu Arch -->
  <path d="M 16 74 A 36 36 0 0 1 84 74" stroke="url(#teal)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Letter A Leg -->
  <path d="M 26 72 L 44 32 L 50 44" stroke="url(#emerald)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Letter S Curve -->
  <path d="M 48 60 Q 64 56 66 46 Q 68 36 56 32" stroke="url(#teal)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Upward Arrow -->
  <path d="M 50 68 L 50 16" stroke="url(#emerald)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 38 28 L 50 12 L 62 28" stroke="url(#emerald)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>